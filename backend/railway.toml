# Affilibuster Backend - Railway Config as Code
# ==============================================
# This file defines the Railway deployment configuration for the FastAPI backend.
#
# Documentation: https://docs.railway.com/reference/config-as-code
#
# Note: Environment variables must be configured in the Railway dashboard.
# Required environment variables for Backend:
#   - DATABASE_URL (auto-populated from Railway PostgreSQL)
#   - REDIS_URL (auto-populated from Railway Redis)
#   - APP_ENV=production
#   - DEBUG=false
#   - LOG_LEVEL=INFO
#   - CMS_PROTOCOL=http
#   - CMS_HOST=<internal-cms-hostname>
#   - CMS_PORT=<cms-internal-port>
#   - BACKEND_PROTOCOL=http
#   - BACKEND_HOST=<internal-backend-hostname>
#   - BACKEND_PORT=$PORT (Railway provides PORT env var)
#   - THE_GREEN_BROTHER_PROTOCOL=https
#   - THE_GREEN_BROTHER_HOST=<your-frontend-domain>
#   - THE_GREEN_BROTHER_PORT=443
#   - JWT_SECRET (generate a secure random string)
#   - REDIS_TTL_PREFERENCES=2592000

[build]
builder = "NIXPACKS"
buildCommand = "pip install uv && uv sync --frozen"

[deploy]
startCommand = "uv run alembic upgrade head && PYTHONPATH=src uv run uvicorn affilibuster_backend.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
