[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --verbose
    --strict-markers
    --tb=short
    -n auto
    --dist worksteal
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-report=lcov
    --cov-fail-under=80
    --cov-branch
    --no-cov-on-fail
    --cov-context=test

# Filter warnings
# Treat warnings as errors by default
filterwarnings =
    error
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore:No data was collected.*:
    ignore::coverage.exceptions.CoverageWarning

# Asyncio mode
asyncio_mode = auto

# Markers
# Usage examples:
#   pytest -m "unit"                  # Run only unit tests
#   pytest -m "integration"           # Run only integration tests
#   pytest -m "contract"              # Run only contract tests
#   pytest -m "not slow"              # Skip slow tests
#   pytest -m "unit or integration"   # Run unit OR integration tests
#   pytest -m "integration and not slow"  # Integration tests that aren't slow
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (requires DB/Redis)
    contract: Contract tests (API schema validation)
    performance: Performance and load tests
    slow: Slow running tests (>5 seconds)
    requires_db: Tests that require database connection
    requires_redis: Tests that require Redis connection
    serial: Tests that must run serially (not in parallel)

# Coverage options
[coverage:run]
source = src
parallel = True
concurrency = multiprocessing
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */virtualenv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
