[project]
name = "affilibuster-backend"
version = "0.1.0"
description = "Multi-language affiliate platform backend API"
authors = [{ name = "Affilibuster Team" }]
requires-python = ">=3.13"
readme = "../README.md"
dependencies = [
  "fastapi==0.128.5",
  "uvicorn[standard]==0.40.0",
  "sqlalchemy==2.0.46",
  "alembic==1.18.3",
  "pydantic==2.12.5",
  "pydantic-settings==2.12.0",
  "psycopg2-binary==2.9.11",
  "asyncpg==0.31.0",
  "redis==7.1.0",
  "httpx==0.28.1",
  "python-jose[cryptography]==3.5.0",
  "passlib[bcrypt]==1.7.4",
  "python-multipart==0.0.22",
  "datamodel-code-generator==0.48.0", # 0.49.0 creates a regression where generation gets stuck
  "email-validator==2.3.0",
  "aiosqlite==0.22.1",
  "pyyaml==6.0.3",
  "greenlet==3.3.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "pytest-xdist==3.8.0",
  "pytest-mock==3.15.1",
  "ruff==0.15.0",
  "mypy==1.19.1",
  "taskipy==1.14.1",
  "types-pyyaml==6.0.12.20250915",
  "pycountry==24.6.1",
]

[tool.taskipy.tasks]
start = { cmd = """\
    exec python -m uvicorn affilibuster_backend.main:app \
    """, cwd = "src", help = "starts the FastAPI server" }
clean = { cmd = """\
    find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true && \
    find . -type f -name '*.pyc' -delete 2>/dev/null || true && \
    find . -type f -name '*.pyo' -delete 2>/dev/null || true && \
    find . -type f -name '.coverage*' -delete 2>/dev/null || true && \
    rm -rf .pytest_cache .coverage htmlcov .mypy_cache || true && \
    rm -rf coverage.lcov coverage.xml venv .venv || true \
    """, help = "removes Python cache files, coverage files, and build artifacts" }
lint = { cmd = "ruff check . && mypy .", help = "runs code style checks with ruff and type checking with mypy" }
lint-fix = { cmd = "ruff check . --fix && mypy .", help = "auto-fixes code style issues with ruff and type checking with mypy" }
format = { cmd = "ruff format . --check", help = "checks code formatting without making changes" }
format-fix = { cmd = "ruff format .", help = "formats code using ruff" }
openapi-generate = { cmd = """\
    mkdir -p src/affilibuster_backend/domain/entities/generated && \
    touch src/affilibuster_backend/domain/entities/generated/__init__.py && \
    datamodel-codegen \
    """, help = "generates Python models from OpenAPI specification" }
generate-cms-api = { cmd = "PYTHONPATH=src:. python scripts/generate_cms_api.py", help = "auto-generates cms_routes.py and cms_entities.py from generated models" }
seed = { cmd = "PYTHONPATH=src:. python -m scripts.seed", help = "seeds PostgreSQL database with data from backend-seed.jsonl" }
migrate = { cmd = "alembic upgrade head", help = "runs database migrations to latest version" }
migrate-create = { cmd = "alembic revision --autogenerate -m", help = "creates a new migration (usage: uv run task migrate-create 'description')" }
migrate-downgrade = { cmd = "alembic downgrade -1", help = "downgrades database by one migration" }
migrate-history = { cmd = "alembic history", help = "shows migration history" }
migrate-current = { cmd = "alembic current", help = "shows current migration version" }

[tool.ruff]
target-version = "py313"
line-length = 120
respect-gitignore = true
extend-exclude = ["src/affilibuster_backend/domain/entities/generated"]

[tool.ruff.lint]
select = ["ALL"]
extend-ignore = [
  "TRY003", # Avoid specifying long messages outside the exception class
  "EM102", # Exception must not use an f-string literal, assign to variable first
  "EM101", # Exception must not use a string literal, assign to variable first
  "D203", # 1 blank line required before class docstring (use D211 instead)
  "D212", # Multi-line docstring summary should start at the first line
  "COM812", # Missing trailing comma in a list or tuple
]

[tool.ruff.lint.extend-per-file-ignores]
"src/affilibuster_backend/infrastructure/dependencies.py" = [
  "PLC0415", # Lazy imports required to avoid circular dependencies
]
"alembic/**/*.py" = [
  "N999", # Alembic migration files use timestamp-based names
]
"tests/**/*.py" = [
  "PLC0415", # `import` should be at the top-level of a file
  "S101", # Use of assert detected,
  "S105", # Possible hardcoded password (test tokens)
  "S106", # Possible hardcoded password (test tokens)
  "ANN201", # Missing return type annotation for public function
  "ANN202", # Missing return type annotation for private function
  "ANN001", # Missing type annotation for function argument (pytest fixtures)
  "ARG001", # Unused function argument (pytest fixtures can be unused)
  "ARG002", # Unused function argument
  "SLF001", # Private member accessed
  "PLR2004", # Magic value used in comparison
  "D104", # Missing docstring in public package (test __init__.py files)
  "PTH123", # Use of open() in tests is acceptable
  "PERF401", # List comprehension optimization in test fixtures
  "ERA001", # Commented-out code (useful for documenting alternatives in tests)
  "FBT003", # Boolean positional value in function call (tests can use booleans)
  "PT011", # pytest.raises can be broad in tests
  "N815", # mixedCase variable names (for matching API responses)
  "SIM117", # Multiple with statements are clearer in tests
  "SIM105", # contextlib.suppress is less clear in tests
  "DTZ001", # Naive datetime creation needed for testing timezone handling
  "DTZ007", # strptime without timezone needed for testing
]

[tool.ruff.lint.flake8-builtins]
strict-checking = true

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings for consistency
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.datamodel-codegen]
input = "../contracts/affilibuster.openapi.yaml"
output = "src/affilibuster_backend/domain/entities/generated/models.py"
custom-file-header = "# Copyright (c) 2026 Affilibuster by Ronen Druker."
target-python-version = "3.13"
input-file-type = "openapi"
output-model-type = "pydantic_v2.BaseModel"
formatters = ["ruff-format", "ruff-check"]
openapi-scopes = ["schemas", "paths", "tags", "parameters"]
allow-population-by-field-name = true
field-constraints = true
snake-case-field = true
no-alias = false # allow camelCase aliases
strict-nullable = false
strip-default-none = false
use-default = true
use-default-factory-for-optional-nested-models = true
use-schema-description = true
use-field-description = true
capitalize-enum-members = true

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["generated", ".venv", "venv"]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "affilibuster_backend.domain.entities.generated.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
# Relax mypy strictness for test files
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
# Test discovery
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Output options
addopts = """\
  --verbose \
  --strict-markers \
  --tb=short \
  -n auto \
  --dist worksteal \
  --cov=src \
  --cov-report=term-missing \
  --cov-report=html \
  --cov-report=xml \
  --cov-report=lcov \
  --cov-fail-under=100 \
  --cov-branch \
  --no-cov-on-fail \
  --cov-context=test \
"""

# Filter warnings
filterwarnings = [
  # Treat all warnings as errors
  "error",
  # Ignore specific warnings
  "ignore::pytest.PytestUnraisableExceptionWarning"
]

# Asyncio mode
asyncio_mode = "auto"

# Markers
# Usage examples:
#   pytest -m "unit"                  # Run only unit tests
#   pytest -m "integration"           # Run only integration tests
#   pytest -m "contract"              # Run only contract tests
#   pytest -m "not slow"              # Skip slow tests
#   pytest -m "unit or integration"   # Run unit OR integration tests
#   pytest -m "integration and not slow"  # Integration tests that aren't slow
markers = [
  "unit: Unit tests (fast, no external dependencies)",
  "integration: Integration tests (requires DB/Redis)",
  "contract: Contract tests (API schema validation)",
  "performance: Performance and load tests",
  "slow: Slow running tests (>5 seconds)",
  "requires_db: Tests that require database connection",
  "requires_redis: Tests that require Redis connection",
  "serial: Tests that must run serially (not in parallel)",
]

# Coverage options
[tool.coverage.run]
source = ["src"]
parallel = true
concurrency = ["thread"]
omit = [
  "*/tests/*",
  "*/test_*.py",
  "*/__pycache__/*",
  "*/venv/*",
  "*/virtualenv/*",
  "*/alembic/*",
  "*/database/alembic/*",
  "*/domain/entities/generated/*",
  "*/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@abstractmethod"
]

# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#using-pep-621
[tool.alembic]
script_location = "src/affilibuster_backend/infrastructure/database/alembic"
file_template = "%%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s"
prepend_sys_path = "src"
timezone = "UTC"
truncate_slug_length = 40
version_path_separator = "os"  # Use os.pathsep. Default configuration used for new projects.

# Logging configuration
[[tool.alembic.loggers]]
keys = ["root", "sqlalchemy", "alembic"]

[[tool.alembic.handlers]]
keys = "console"

[[tool.alembic.formatters]]
keys = "generic"

[[tool.alembic.logger_root]]
level = "WARN"
handlers = "console"
qualname = ""

[[tool.alembic.logger_sqlalchemy]]
level = "WARN"
handlers = ""
qualname = "sqlalchemy.engine"

[[tool.alembic.logger_alembic]]
level = "INFO"
handlers = ""
qualname = "alembic"

[[tool.alembic.handler_console]]
class = "StreamHandler"
args = "(sys.stderr,)"
level = "NOTSET"
formatter = "generic"

[[tool.alembic.formatter_generic]]
format = "%(levelname)-5.5s [%(name)s] %(message)s"
datefmt = "%H:%M:%S"
