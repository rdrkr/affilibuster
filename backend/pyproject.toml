[project]
name = "affilibuster-backend"
version = "0.1.0"
description = "Multi-language affiliate platform backend API"
authors = [{ name = "Affilibuster Team" }]
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.120.4",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.37",
  "alembic==1.17.1",
  "pydantic>=2.10.5",
  "pydantic-settings>=2.7.1",
  "psycopg2-binary>=2.9.10",
  "asyncpg>=0.30.0",
  "redis==7.0.1",
  "httpx>=0.28.1",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.20",
  "datamodel-code-generator>=0.35.0",
  "email-validator>=2.0.0",
  "aiosqlite>=0.20.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=6.0.0",
  "pytest-xdist>=3.6.1",
  "pytest-mock>=3.12.0",
  "aiosqlite>=0.20.0",
  "ruff>=0.14.3",
  "mypy>=1.14.1",
]

[tool.ruff]
src = ["src"]
target-version = "py313"
line-length = 120
respect-gitignore = true

[tool.ruff.lint]
#select = ["ALL"]
extend-ignore = [
  "TRY003", # Avoid specifying long messages outside the exception class
  "EM102", # Exception must not use an f-string literal, assign to variable first
  "EM101", # Exception must not use a string literal, assign to variable first
  "D203", # 1 blank line required before class docstring (use D211 instead)
  "D212", # Multi-line docstring summary should start at the first line
  "COM812", # Missing trailing comma in a list or tuple
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/**/*.py" = [
  "PLC0415", # `import` should be at the top-level of a file
  "S101", # Use of assert detected,
  "ANN201", # Missing return type annotation for public function
]

[tool.ruff.lint.flake8-builtins]
strict-checking = true

[tool.ruff.format]
docstring-code-format = true

[tool.datamodel-codegen]
field-constraints = true
snake-case-field = true
strip-default-none = false
target-python-version = "3.13"
use-schema-description = true
use-field-description = true
capitalize-enum-members = true
input-file-type = "openapi"
openapi-scopes = ["schemas", "paths", "tags", "parameters"]
output-model-type = "pydantic_v2.BaseModel"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
exclude = ["generated", ".venv", "venv"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "infrastructure.api.models.generated.*"
ignore_errors = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
