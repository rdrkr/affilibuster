[project]
name = "affilibuster-backend"
version = "0.1.0"
description = "Multi-language affiliate platform backend API"
authors = [{ name = "Affilibuster Team" }]
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.120.3",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.37",
  "alembic==1.17.1",
  "pydantic>=2.10.5",
  "pydantic-settings>=2.7.1",
  "psycopg2-binary>=2.9.10",
  "asyncpg>=0.30.0",
  "redis==7.0.1",
  "httpx>=0.28.1",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.20",
  "datamodel-code-generator>=0.35.0",
  "email-validator>=2.0.0",
  "aiosqlite>=0.20.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "pytest-xdist>=3.6.1",
  "aiosqlite>=0.20.0",
  "black>=24.10.0",
  "ruff>=0.8.6",
  "mypy>=1.14.1",
  "isort>=6.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src"]
exclude = ["generated", ".venv", "venv", "__pycache__", "build", "dist"]

[tool.black]
line-length = 120
target-version = ['py313']
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | \.venv
  | generated
  | __pycache__
  | build
  | dist
)/
'''

[tool.datamodel-codegen]
field-constraints = true
snake-case-field = true
strip-default-none = false
target-python-version = "3.13"
use-schema-description = true
use-field-description = true
capitalize-enum-members = true
input-file-type = "openapi"
openapi-scopes = ["schemas", "paths", "tags", "parameters"]
output-model-type = "pydantic_v2.BaseModel"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
exclude = ["generated", ".venv", "venv"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "infrastructure.api.models.generated.*"
ignore_errors = true

[tool.isort]
profile = "black"
skip_gitignore = true
extend_skip = ["generated", ".venv", "venv"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
