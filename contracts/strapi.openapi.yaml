  /about:
    get:
      operationId: about/get/about
      parameters:
        - name: fields
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            description: The fields to return, this doesn't include populatable fields like relations, components, files, or dynamic zones
            readOnly: true
            type: array
            items:
              type: string
              enum:
                - createdAt
                - updatedAt
                - publishedAt
                - locale
            example:
              - createdAt
              - updatedAt
              - publishedAt
          x-strapi-serialize: querystring
          description: Select specific fields to return in the response (field projection). Only scalar fields can be selected; relations, components, files, and dynamic zones must be populated separately.
        - name: filters
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            description: Filters to apply to the query
            type: object
            propertyNames:
              type: string
              enum:
