          x-strapi-serialize: querystring
          description: Filter entries using Strapi query operators. Supports comparison ($eq, $ne, $lt, $lte, $gt, $gte), containment ($in, $notIn), text search ($contains, $notContains, $startsWith, $endsWith), logical operators ($and, $or, $not), and more.
        - name: locale
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            description: Select a locale
            type: string
            example: en
          x-strapi-serialize: querystring
          description: Select content for a specific locale when using Strapi Internationalization (i18n). Defaults to the default locale if not specified.
        - name: status
          in: query
          required: false
          schema:
            $schema: https://json-schema.org/draft/2020-12/schema
            description: Fetch documents based on their status. Default to "published" if not specified.
            type: string
            enum:
              - draft
              - published
            example: published
          x-strapi-serialize: querystring
          description: Filter documents by publication status. Use "published" for published content or "draft" for draft content. Defaults to "published" when not specified.
        - name: customPopulate
          in: query
          description: Populate fields using nested-populator syntax. Use "nested" for full depth or specify fields.
          required: true
          schema:
            type: string
            default: nested
        - name: customDepth
          in: query
          description: Maximum depth for population (override plugin default)
          required: false
          schema:
            type: integer
        - name: customIgnored
          in: query
          description: Fields to ignore during population
          required: false
          schema:
            type: array
            items:
              type: string
