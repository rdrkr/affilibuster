          example: USD
        name:
          type: string
          description: Full currency name
          example: US Dollar
        symbol:
          type: string
          description: Currency symbol
          example: $
        displayName:
          type: string
          description: Display name for UI
          example: USD ($)
        decimalPlaces:
          type: integer
          minimum: 0
          maximum: 8
          default: 2
          description: Number of decimal places for amounts
        symbolPosition:
          type: string
          enum:
            - before
            - after
          default: before
          description: Whether symbol appears before or after amount
        thousandsSeparator:
          type: string
          default: ','
          description: Thousands separator character
        decimalSeparator:
          type: string
          default: .
          description: Decimal separator character
        exchangeRate:
          type: number
          default: 1
          description: Exchange rate relative to base currency
        sortOrder:
          type: integer
          default: 0
          description: Display order in currency lists
        isActive:
          type: boolean
          default: true
          description: Whether currency is currently available
        createdAt:
          type: string
          format: date-time
          description: Timestamp when this entry was first created in the CMS.
          example: '2025-10-30T17:41:47.696Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when this entry was last modified.
          example: '2025-10-30T18:23:15.432Z'
        publishedAt:
          type: string
          format: date-time
          description: Timestamp when this entry was published. Null for draft entries. Part of Strapi Draft & Publish feature.
          example: '2025-10-30T17:41:47.696Z'
      required:
        - documentId
        - id
        - code
        - name
        - symbol
        - displayName
        - decimalPlaces
        - symbolPosition
        - thousandsSeparator
        - decimalSeparator
        - exchangeRate
        - sortOrder
        - isActive
        - publishedAt
