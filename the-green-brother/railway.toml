# Affilibuster TheGreenBrother - Railway Config as Code
# ======================================================
# This file defines the Railway deployment configuration for the Next.js frontend.
#
# Documentation: https://docs.railway.com/reference/config-as-code
#
# Note: Environment variables must be configured in the Railway dashboard.
# Required environment variables for TheGreenBrother:
#   - NODE_ENV=production
#   - CMS_PROTOCOL=https
#   - CMS_HOST=<your-cms-domain>
#   - CMS_PORT=443
#   - THE_GREEN_BROTHER_PROTOCOL=https
#   - THE_GREEN_BROTHER_HOST=<your-frontend-domain>
#   - THE_GREEN_BROTHER_PORT=443
#   - NEXT_PUBLIC_API_URL=http://<internal-backend-hostname>:<port>/v1
#   - NEXT_SERVER_SIDE_API_URL=http://<internal-backend-hostname>:<port>/v1
#   - NEXT_PUBLIC_CMS_URL=https://<your-cms-domain>
#   - REVALIDATE_SECRET (generate a secure random string)

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
