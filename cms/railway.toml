# Affilibuster CMS - Railway Config as Code
# ==========================================
# This file defines the Railway deployment configuration for the Strapi CMS.
#
# Documentation: https://docs.railway.com/reference/config-as-code
#
# Note: Environment variables must be configured in the Railway dashboard.
# Required environment variables for CMS:
#   - DATABASE_URL (auto-populated from Railway PostgreSQL)
#   - NODE_ENV=production
#   - CMS_PROTOCOL=https
#   - CMS_HOST=<your-cms-domain>
#   - CMS_PORT=443
#   - ADMIN_JWT_SECRET (generate a secure random string)
#   - API_TOKEN_SALT (generate a secure random string)
#   - API_TOKEN_ENCRYPTION_KEY (generate a secure random string)
#   - TRANSFER_TOKEN_SALT (generate a secure random string)
#   - APP_KEYS (generate a secure random string)
#   - CLOUDINARY_NAME (your Cloudinary cloud name)
#   - CLOUDINARY_KEY (your Cloudinary API key)
#   - CLOUDINARY_SECRET (your Cloudinary API secret)

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
