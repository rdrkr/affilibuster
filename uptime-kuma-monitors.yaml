# Uptime Kuma Configuration
# This file serves as the source of truth for Uptime Kuma monitors.

settings:
  # General settings (optional, can be expanded)
  timezone: 'UTC'

notifications:
  - name: 'Telegram Alert'
    type: 'telegram'
    # Bot token and chat ID are read from environment variables:
    #   UPTIME_KUMA_TELEGRAM_BOT_TOKEN - Telegram bot token from @BotFather
    #   UPTIME_KUMA_TELEGRAM_CHAT_ID   - Target chat/group/channel ID
    isDefault: true
    applyExisting: true

monitor_groups:
  - name: 'Critical Services'
    monitors:
      - name: 'TheGreenBrother Frontend'
        type: 'http'
        url: 'https://thegreenbrother.com'
        interval: 60
        retryInterval: 60
        maxretries: 1
        upsideDown: false # Default
        notificationNames:
          - 'Telegram Alert'

      - name: 'Backend API Health'
        type: 'http'
        url: 'https://thegreenbrother.com/api/health'
        interval: 60
        maxretries: 3
        notificationNames:
          - 'Telegram Alert'

      - name: 'CMS Admin Panel'
        type: 'http'
        url: 'https://cms.thegreenbrother.com/admin'
        interval: 60
        maxretries: 3
        notificationNames:
          - 'Telegram Alert'

  - name: 'Content Verification'
    monitors:
      - name: 'Homepage Keyword'
        type: 'keyword'
        url: 'https://thegreenbrother.com'
        keyword: 'TheGreenBrother'
        interval: 120
        maxretries: 2
        notificationNames:
          - 'Telegram Alert'

  - name: 'Internal Infrastructure'
    monitors:
      - name: 'Uptime Kuma Health (Self)'
        type: 'http'
        url: 'http://uptime-kuma:3001' # Internal Docker URL
        interval: 60
        notificationNames:
          - 'Telegram Alert'
