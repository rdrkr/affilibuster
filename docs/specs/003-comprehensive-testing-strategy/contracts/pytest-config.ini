# Pytest configuration contract for comprehensive testing strategy
# Target: backend/pytest.ini

[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Execution options
addopts =
    --verbose
    --strict-markers
    --tb=short
    -n auto                          # ADDED: Parallel execution with pytest-xdist
    --dist worksteal                 # ADDED: Better load balancing across workers
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-report=lcov                # ADDED: LCOV format for coverage merging
    --cov-fail-under=80              # UPDATED: 80% minimum (was 50%)

# Asyncio mode
asyncio_mode = auto

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests
    contract: Contract tests (API schema validation)
    performance: Performance and load tests
    slow: Slow running tests
    requires_db: Tests that require database connection
    requires_redis: Tests that require Redis connection
    serial: Tests that must run serially (not in parallel)  # ADDED

[coverage:run]
source = src
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */virtualenv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
