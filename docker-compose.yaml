services:
  postgres:
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:17-alpine
        RUN cat > /docker-entrypoint-initdb.d/init-db.sh <<'EOF'
        set -e
        # Create both databases from the default postgres database
        psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "postgres" <<-EOSQL
            CREATE DATABASE "$$POSTGRES_BACKEND_NAME";
            CREATE DATABASE "$$POSTGRES_CMS_NAME";
            GRANT ALL PRIVILEGES ON DATABASE "$$POSTGRES_BACKEND_NAME" TO "$$POSTGRES_USER";
            GRANT ALL PRIVILEGES ON DATABASE "$$POSTGRES_CMS_NAME" TO "$$POSTGRES_USER";
        EOSQL
        # Add extensions to backend database
        psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_BACKEND_NAME" <<-EOSQL
            CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        EOSQL
        # Add extensions to CMS database
        psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_CMS_NAME" <<-EOSQL
            CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        EOSQL
        echo "Databases initialized successfully!"
        EOF
        RUN chmod +x /docker-entrypoint-initdb.d/init-db.sh
    image: affilibuster-postgres:latest
    container_name: affilibuster-postgres
    restart: on-failure:2
    env_file: # Load environment variables from .env file at build time
      - .env
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_BACKEND_NAME}" ]
      interval: 5s
      timeout: 10s
      retries: 50

  redis:
    image: redis:7-alpine
    container_name: affilibuster-redis
    restart: on-failure:2
    env_file: # Load environment variables from .env file at build time
      - .env
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 10s
      retries: 50

  strapi:
    mem_limit: 4g
    cpus: 2
    build:
      context: ./cms
      dockerfile: Dockerfile
      args:
        CMS_PORT: ${CMS_PORT}
    container_name: affilibuster-strapi
    restart: on-failure:2
    depends_on:
      postgres:
        condition: service_healthy
    env_file: # Load environment variables from .env file at build time
      - .env
    ports:
      - "${CMS_PORT}:${CMS_PORT}"
    volumes:
      - ./cms:/app
      - ./contracts:/contracts
      - ./.env:/app/.env
      - strapi_uploads:/app/public/uploads
    healthcheck:
      test: [ "CMD", "curl", "-f", "${CMS_PROTOCOL}://${CMS_HOST}:${CMS_PORT}/admin" ]
      interval: 5s
      timeout: 10s
      retries: 50

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_PORT: ${BACKEND_PORT}
    container_name: affilibuster-backend
    restart: on-failure:2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      strapi:
        condition: service_healthy
    env_file: # Load environment variables from .env file at build time
      - .env
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      - ./backend:/app
      - ./contracts:/contracts
      - ./.env:/app/.env
      - backend_venv:/app/.venv
    healthcheck:
      test: [ "CMD", "curl", "-f", "${BACKEND_PROTOCOL}://${INTERNAL_BACKEND_HOST}:${BACKEND_PORT}/health" ]
      interval: 5s
      timeout: 10s
      retries: 50

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_PORT: ${FRONTEND_PORT}
    container_name: affilibuster-frontend
    mem_limit: 2g
    cpus: 1
    restart: on-failure:2
    depends_on:
      backend:
        condition: service_healthy
    env_file: # Load environment variables from .env file at build time
      - .env
    environment:
      NEXT_PUBLIC_API_URL: "${BACKEND_PROTOCOL}://${INTERNAL_BACKEND_HOST}:${BACKEND_PORT}/v1"
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app
      - ./contracts:/contracts
      - ./.env:/app/.env
      - /app/node_modules
      - /app/.next
    healthcheck:
      test: [ "CMD", "curl", "-f", "${FRONTEND_PROTOCOL}://${INTERNAL_FRONTEND_HOST}:${FRONTEND_PORT}" ]
      interval: 5s
      timeout: 10s
      retries: 50

volumes:
  postgres_data:
  redis_data:
  strapi_uploads:
  backend_venv:
