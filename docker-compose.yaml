services:
  postgres:
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:18-alpine
        RUN cat > /docker-entrypoint-initdb.d/init-db.sh <<'EOF'
        set -e
        # Create single database
        psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<-EOSQL
            CREATE DATABASE "$$POSTGRES_DB";
            GRANT ALL PRIVILEGES ON DATABASE "$$POSTGRES_DB" TO "$$POSTGRES_USER";
        EOSQL
        # Add UUID extension to the database
        psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" <<-EOSQL
            CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        EOSQL
        echo "Database initialized successfully!"
        EOF
        RUN chmod +x /docker-entrypoint-initdb.d/init-db.sh
    restart: on-failure:2
    env_file: # Load environment variables from .env file at build time
      - .env
    environment:
      # Tell PostgreSQL to listen on custom port (defaults to 5432)
      PGPORT: ${POSTGRES_PORT}
      # Pass POSTGRES_DB to init script
      POSTGRES_DB: ${POSTGRES_DB}
    command: postgres -p ${POSTGRES_PORT}
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 10s
      retries: 50

  redis:
    image: redis:7-alpine
    restart: on-failure:2
    env_file: # Load environment variables from .env file at build time
      - .env
    command: redis-server --port ${REDIS_PORT}
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-p', '${REDIS_PORT}', 'ping']
      interval: 5s
      timeout: 10s
      retries: 50

  strapi:
    build:
      context: ./cms
      dockerfile: Dockerfile
      args:
        CMS_PORT: ${CMS_PORT}
    restart: on-failure:2
    depends_on:
      postgres:
        condition: service_healthy
    env_file: # Load environment variables from .env file at build time
      - .env
    expose:
      - '${CMS_PORT}'
    volumes:
      - ./cms:/app
      - ./contracts:/contracts
      - ./data:/data
      - ./.env:/app/.env
      - strapi_uploads:/app/public/uploads
    healthcheck:
      # noinspection HttpUrlsUsage
      test: ['CMD', 'curl', '-f', 'http://${CMS_HOST}:${CMS_PORT}/admin']
      interval: 5s
      timeout: 10s
      retries: 50

  strapi-proxy:
    build:
      context: ./cms
      dockerfile_inline: |
        # Nginx reverse proxy for Strapi CMS with SSL support
        FROM nginx:1.27-alpine

        # Install gettext for envsubst (environment variable substitution)
        RUN apk add --no-cache gettext

        # Copy Nginx configuration template
        COPY nginx.conf.template /etc/nginx/nginx.conf.template

        # Create directory for certificates
        RUN mkdir -p /etc/nginx/certs

        # Create startup script to substitute env vars and start nginx
        RUN echo '#!/bin/sh' > /docker-entrypoint.sh && \
            echo 'envsubst '"'"'$$CMS_PORT $$CMS_HOST'"'"' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf' >> /docker-entrypoint.sh && \
            echo 'exec nginx -g "daemon off;"' >> /docker-entrypoint.sh && \
            chmod +x /docker-entrypoint.sh

        # Expose HTTPS port and HTTP redirect port (1338)
        EXPOSE ${CMS_PORT} 1338

        # Use custom entrypoint
        ENTRYPOINT ["/docker-entrypoint.sh"]
    restart: on-failure:2
    depends_on:
      strapi:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - '${CMS_PORT}:${CMS_PORT}'
    volumes:
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ['CMD', 'curl', '-fk', '${CMS_PROTOCOL}://${CMS_HOST}:${CMS_PORT}/admin']
      interval: 5s
      timeout: 10s
      retries: 50

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BACKEND_PORT: ${BACKEND_PORT}
    restart: on-failure:2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      strapi-proxy:
        condition: service_healthy
    env_file: # Load environment variables from .env file at build time
      - .env
    ports:
      - '${BACKEND_PORT}:${BACKEND_PORT}'
    volumes:
      - ./backend:/app
      - ./contracts:/contracts
      - ./data:/data
      - ./.env:/app/.env
      - backend_venv:/app/.venv
      - ./certs:/certs:ro
    healthcheck:
      test: ['CMD', 'curl', '-fk', '${BACKEND_PROTOCOL}://${BACKEND_HOST}:${BACKEND_PORT}/health']
      interval: 5s
      timeout: 10s
      retries: 50

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FRONTEND_PORT: ${FRONTEND_PORT}
    restart: on-failure:2
    depends_on:
      backend:
        condition: service_healthy
    env_file: # Load environment variables from .env file at build time
      - .env
    environment:
      # Next.js respects PORT env var for custom listen port
      PORT: ${FRONTEND_PORT}
      NEXT_SERVER_SIDE_API_URL: '${BACKEND_PROTOCOL}://${INTERNAL_BACKEND_HOST}:${BACKEND_PORT}/v1'
    ports:
      - '${FRONTEND_PORT}:${FRONTEND_PORT}'
    volumes:
      - ./frontend:/app
      - ./contracts:/contracts
      - ./data:/data
      - ./.env:/app/.env
      - ./certs:/certs:ro
    healthcheck:
      test: ['CMD', 'curl', '-fk', '${FRONTEND_PROTOCOL}://${FRONTEND_HOST}:${FRONTEND_PORT}']
      interval: 5s
      timeout: 10s
      retries: 50

  ecopicks:
    build:
      context: ./ecopicks
      dockerfile: Dockerfile
      args:
        ECOPICKS_PORT: ${ECOPICKS_PORT}
    restart: on-failure:2
    depends_on:
      backend:
        condition: service_healthy
    env_file: # Load environment variables from .env file at build time
      - .env
    environment:
      # Next.js respects PORT env var for custom listen port
      PORT: ${ECOPICKS_PORT}
      NEXT_SERVER_SIDE_API_URL: '${BACKEND_PROTOCOL}://${INTERNAL_BACKEND_HOST}:${BACKEND_PORT}/v1'
    ports:
      - '${ECOPICKS_PORT}:${ECOPICKS_PORT}'
    volumes:
      - ./ecopicks:/app
      - ./contracts:/contracts
      - ./data:/data
      - ./.env:/app/.env
      - ./certs:/certs:ro
    healthcheck:
      test: ['CMD', 'curl', '-fk', '${ECOPICKS_PROTOCOL}://${ECOPICKS_HOST}:${ECOPICKS_PORT}']
      interval: 5s
      timeout: 10s
      retries: 50

  test-runner:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test-runner
    restart: 'no'
    depends_on:
      frontend:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Point to frontend via host.docker.internal (like accessing from host browser)
      PLAYWRIGHT_BASE_URL: 'https://host.docker.internal:${FRONTEND_PORT}'
      # Disable dev server startup in tests
      SKIP_WEBSERVER: '1'
    ports:
      - '${PLAYWRIGHT_REPORT_PORT}:${PLAYWRIGHT_REPORT_PORT}'
    volumes:
      - ./frontend:/app
      - ./contracts:/contracts
      - ./data:/data
      - ./.env:/app/.env
      - ./certs:/certs:ro
    # Enable host.docker.internal for accessing host network (where frontend is exposed)
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # Recommended Playwright Docker settings
    ipc: host # Prevents Chromium from running out of memory
    init: true # Avoids zombie processes
    # Override entrypoint to prevent running frontend dev server
    entrypoint: []
    command: ['tail', '-f', '/dev/null']

volumes:
  postgres_data:
  redis_data:
  strapi_uploads:
  backend_venv:
