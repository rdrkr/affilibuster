# Affilibuster - Render Blueprint (Infrastructure as Code)
# =========================================================
# This file defines all Render services for Affilibuster production environment.
# Deploy by connecting this repo to Render Dashboard and selecting this Blueprint.
#
# Documentation: https://docs.render.com/infrastructure-as-code

projects:
  - name: Affilibuster
    environments:
      - name: Production
        databases:
          # PostgreSQL - Single database shared by backend and CMS
          - name: affilibuster-production-postgres
            plan: basic-256mb
            region: frankfurt
            databaseName: affilibuster_db
            user: affilibuster_user
            ipAllowList: []
        services:
          # =========================================================
          # REDIS - Cache and Session Store (Key-Value)
          # =========================================================
          - type: keyvalue
            name: affilibuster-production-redis
            plan: starter
            region: frankfurt
            maxmemoryPolicy: allkeys-lru
            ipAllowList: []

          # =========================================================
          # STRAPI CMS - Content Management System
          # =========================================================
          - type: web
            name: affilibuster-production-cms
            runtime: node
            region: frankfurt
            plan: standard
            rootDir: cms
            buildCommand: npm install && npm run build
            startCommand: npm run start
            healthCheckPath: /api/health
            autoDeploy: true
            domains:
              - cms.thegreenbrother.com
            envVars:
              # Node Environment
              - key: NODE_ENV
                value: production

              # Database Configuration (auto-populated from postgres instance)
              - key: POSTGRES_PROTOCOL
                value: postgresql
              - key: POSTGRES_HOST
                fromDatabase:
                  name: affilibuster-production-postgres
                  property: host
              - key: POSTGRES_PORT
                fromDatabase:
                  name: affilibuster-production-postgres
                  property: port
              - key: POSTGRES_USER
                fromDatabase:
                  name: affilibuster-production-postgres
                  property: user
              - key: POSTGRES_PASSWORD
                fromDatabase:
                  name: affilibuster-production-postgres
                  property: password
              - key: POSTGRES_DB
                fromDatabase:
                  name: affilibuster-production-postgres
                  property: database
              - key: POSTGRES_SSL
                value: 'true'
              - key: POSTGRES_SSL_REJECT_UNAUTHORIZED
                value: 'false' # render.com self manages TLS certificates (https://render.com/docs/tls)

              # CMS Configuration
              - key: CMS_PROTOCOL
                value: https
              - key: CMS_PORT
                value: 443
              - key: CMS_HOST
                value: cms.thegreenbrother.com
              - key: INTERNAL_CMS_HOST
                value: affilibuster-production-cms

              # Security Keys
              - key: ADMIN_JWT_SECRET
                generateValue: true
              - key: API_TOKEN_SALT
                generateValue: true
              - key: API_TOKEN_ENCRYPTION_KEY
                generateValue: true
              - key: TRANSFER_TOKEN_SALT
                generateValue: true
              - key: APP_KEYS
                generateValue: true

              # Cloudinary Configuration (for CMS image uploads)
              - key: CLOUDINARY_NAME
                sync: false # Set in Render dashboard
              - key: CLOUDINARY_KEY
                sync: false # Set in Render dashboard
              - key: CLOUDINARY_SECRET
                sync: false # Set in Render dashboard

          # =========================================================
          # BACKEND API - FastAPI Application
          # =========================================================
          # Private service: Only accessible within Render's private network.
          # the-green-brother accesses via internal hostname.
          - type: pserv
            name: affilibuster-production-backend
            runtime: python
            region: frankfurt
            plan: starter
            rootDir: backend
            buildCommand: pip install uv && uv sync --frozen && uv run alembic upgrade head
            startCommand: PYTHONPATH=src uv run uvicorn affilibuster_backend.main:app --host 0.0.0.0 --port 10000
            autoDeploy: true
            envVars:
              # Application Configuration
              - key: APP_ENV
                value: production
              - key: DEBUG
                value: 'false'
              - key: LOG_LEVEL
                value: INFO

              # Database Configuration (auto-populated from postgres instance)
              - key: POSTGRES_PROTOCOL
                value: postgresql
              - key: POSTGRES_HOST
                fromDatabase:
                  name: affilibuster-production-postgres
                  property: host
              - key: POSTGRES_PORT
                fromDatabase:
                  name: affilibuster-production-postgres
                  property: port
              - key: POSTGRES_USER
                fromDatabase:
                  name: affilibuster-production-postgres
                  property: user
              - key: POSTGRES_PASSWORD
                fromDatabase:
                  name: affilibuster-production-postgres
                  property: password
              - key: POSTGRES_DB
                fromDatabase:
                  name: affilibuster-production-postgres
                  property: database
              - key: POSTGRES_SSL
                value: 'true'
              - key: POSTGRES_SSL_REJECT_UNAUTHORIZED
                value: 'false' # render.com self manages TLS certificates (https://render.com/docs/tls)

              # Redis Configuration (auto-populated from Key-Value instance)
              - key: REDIS_PROTOCOL
                value: redis
              - key: REDIS_HOST
                fromService:
                  type: keyvalue
                  name: affilibuster-production-redis
                  property: host
              - key: REDIS_PORT
                fromService:
                  type: keyvalue
                  name: affilibuster-production-redis
                  property: port
              - key: REDIS_TTL_PREFERENCES
                value: 2592000 # 30 days in seconds

              # CMS Configuration (creates dependency: Backend waits for CMS)
              - key: CMS_PROTOCOL
                value: http
              - key: CMS_HOST
                value: affilibuster-production-cms
              - key: CMS_PORT
                value: 10000
              - key: INTERNAL_CMS_HOST
                fromService:
                  type: web
                  name: affilibuster-production-cms
                  property: host

              # Backend Configuration (self-reference for internal use)
              - key: BACKEND_PROTOCOL
                value: http
              - key: BACKEND_PORT
                value: 10000
              - key: BACKEND_HOST
                fromService:
                  type: pserv
                  name: affilibuster-production-backend
                  property: host
              - key: INTERNAL_BACKEND_HOST
                fromService:
                  type: pserv
                  name: affilibuster-production-backend
                  property: host

              - key: THE_GREEN_BROTHER_PROTOCOL
                value: https
              - key: THE_GREEN_BROTHER_HOST
                value: thegreenbrother.com
              - key: THE_GREEN_BROTHER_PORT
                value: 443
              - key: INTERNAL_THE_GREEN_BROTHER_HOST
                value: affilibuster-production-the-green-brother

              # Security
              - key: JWT_SECRET
                generateValue: true

          # =========================================================
          # THE_GREEN_BROTHER - Next.js TheGreenBrother (Primary Affiliate Site)
          # =========================================================
          - type: web
            name: affilibuster-production-the-green-brother
            runtime: node
            region: frankfurt
            plan: standard
            rootDir: the-green-brother
            buildCommand: npm install && npm run build
            startCommand: npm run start
            healthCheckPath: /api/health
            autoDeploy: true
            domains:
              - thegreenbrother.com
              - www.thegreenbrother.com
            envVars:
              # Node Environment
              - key: NODE_ENV
                value: production

              # CMS Configuration (for Next.js image optimization - needs PUBLIC hostname)
              - key: CMS_PROTOCOL
                value: https
              - key: CMS_HOST
                value: cms.thegreenbrother.com
              - key: CMS_PORT
                value: '443'

              # TheGreenBrother Configuration
              - key: THE_GREEN_BROTHER_PROTOCOL
                value: https
              - key: THE_GREEN_BROTHER_PORT
                value: 443
              - key: THE_GREEN_BROTHER_HOST
                value: thegreenbrother.com
              - key: INTERNAL_THE_GREEN_BROTHER_HOST
                value: affilibuster-production-the-green-brother

              # API URLs (creates dependency: TheGreenBrother waits for Backend)
              - key: NEXT_PUBLIC_API_URL
                value: http://affilibuster-production-backend:10000/v1
              - key: NEXT_SERVER_SIDE_API_URL
                value: http://affilibuster-production-backend:10000/v1
              - key: NEXT_PUBLIC_CMS_URL
                value: https://cms.thegreenbrother.com

                # Security
              - key: REVALIDATE_SECRET
                generateValue: true # Auto-generate random secret
