openapi: 3.1.0
info:
  title: Affilibuster Multi-Language Platform API
  version: 1.0.0
  description: |
    API for multi-language eco-friendly affiliate platform supporting English, Italian, and Hebrew.
    Features include localized content delivery, currency management, and user preference tracking.
  contact:
    name: Affilibuster API Support
    email: api@affilibuster.com

servers:
  - url: https://api.affilibuster.com/v1
    description: Production
  - url: http://localhost:8000/v1
    description: Local development

tags:
  - name: Content
    description: Localized content operations
  - name: Languages
    description: Language detection and management
  - name: Currencies
    description: Currency conversion and formatting
  - name: Preferences
    description: User preferences management

paths:
  # Content API
  /content/{lang}/{slug}:
    get:
      summary: Get localized content by slug
      description: Retrieves content in the specified language. Falls back to English if translation unavailable.
      tags: [Content]
      parameters:
        - $ref: '#/components/parameters/LanguageCode'
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: Content found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentResponse'
        '404':
          description: Content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /content/{lang}:
    get:
      summary: List content by language
      description: Returns paginated list of published content for specified language
      tags: [Content]
      parameters:
        - $ref: '#/components/parameters/LanguageCode'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [page, product, article]
      responses:
        '200':
          description: Content list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentListResponse'

  # Language API
  /languages:
    get:
      summary: Get all supported languages
      description: Returns list of active languages with metadata
      tags: [Languages]
      responses:
        '200':
          description: Languages list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Language'

  /languages/detect:
    post:
      summary: Detect user's preferred language
      description: Analyzes Accept-Language header and user-agent to determine preferred language
      tags: [Languages]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                acceptLanguage:
                  type: string
                  example: "it-IT,it;q=0.9,en-US;q=0.8,en;q=0.7"
                userAgent:
                  type: string
                  example: "Mozilla/5.0 ..."
                countryCode:
                  type: string
                  example: "IT"
                  description: Optional ISO 3166-1 alpha-2 country code from IP geolocation
              required:
                - acceptLanguage
      responses:
        '200':
          description: Detected language
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetectedLanguage'

  # Currency API
  /currencies:
    get:
      summary: Get all supported currencies
      description: Returns list of active currencies with formatting rules
      tags: [Currencies]
      responses:
        '200':
          description: Currencies list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Currency'

  /currencies/convert:
    post:
      summary: Convert price to selected currency
      description: Converts amount from one currency to another with proper formatting
      tags: [Currencies]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  format: double
                  example: 29.99
                fromCurrency:
                  type: string
                  example: "USD"
                toCurrency:
                  type: string
                  example: "EUR"
                locale:
                  type: string
                  example: "it-IT"
                  description: Optional locale for formatting (defaults to target currency's locale)
              required:
                - amount
                - fromCurrency
                - toCurrency
      responses:
        '200':
          description: Converted currency
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertedCurrency'

  # User Preferences API
  /user/preferences:
    get:
      summary: Get user preferences
      description: Retrieves user preferences by session ID or user ID
      tags: [Preferences]
      parameters:
        - name: X-Session-Id
          in: header
          required: true
          schema:
            type: string
            example: "sess-abc123def456"
        - name: X-User-Id
          in: header
          required: false
          schema:
            type: string
            example: "user-789xyz"
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'
        '404':
          description: Preferences not found (create with PUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Update user preferences
      description: Creates or updates user preferences
      tags: [Preferences]
      parameters:
        - name: X-Session-Id
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePreferences'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferences'

components:
  parameters:
    LanguageCode:
      name: lang
      in: path
      required: true
      description: Language code
      schema:
        type: string
        enum: [en, it, he]
        example: "it"

    Slug:
      name: slug
      in: path
      required: true
      description: URL-safe content slug
      schema:
        type: string
        pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
        example: "eco-water-bottle"

    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    Language:
      type: object
      properties:
        code:
          type: string
          enum: [en, it, he]
          example: "it"
        displayName:
          type: string
          example: "Italian"
        nativeName:
          type: string
          example: "Italiano"
        direction:
          type: string
          enum: [ltr, rtl]
          example: "ltr"
        urlPrefix:
          type: string
          example: "/it"
        defaultCurrency:
          type: string
          example: "EUR"
        localeCode:
          type: string
          example: "it-IT"
        isDefault:
          type: boolean
          example: false
      required:
        - code
        - displayName
        - nativeName
        - direction
        - urlPrefix
        - defaultCurrency
        - localeCode
        - isDefault

    DetectedLanguage:
      type: object
      properties:
        detectedLanguage:
          type: string
          enum: [en, it, he]
          example: "it"
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.95
        shouldPrompt:
          type: boolean
          description: Whether to show language switch prompt
          example: true
        suggestedUrl:
          type: string
          format: uri
          example: "https://affilibuster.com/it/products/eco-bottle"
      required:
        - detectedLanguage
        - confidence
        - shouldPrompt

    Currency:
      type: object
      properties:
        code:
          type: string
          pattern: '^[A-Z]{3}$'
          example: "EUR"
        name:
          type: string
          example: "Euro"
        symbol:
          type: string
          example: "€"
        decimalPlaces:
          type: integer
          minimum: 0
          maximum: 3
          example: 2
        symbolPosition:
          type: string
          enum: [before, after]
          example: "after"
        thousandsSeparator:
          type: string
          example: "."
        decimalSeparator:
          type: string
          example: ","
      required:
        - code
        - name
        - symbol
        - decimalPlaces
        - symbolPosition

    ConvertedCurrency:
      type: object
      properties:
        amount:
          type: number
          format: double
          example: 27.50
        currency:
          type: string
          example: "EUR"
        formatted:
          type: string
          example: "27,50 €"
        exchangeRate:
          type: number
          format: double
          example: 0.9167
          description: Exchange rate used (from/to)
      required:
        - amount
        - currency
        - formatted

    ContentResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "c-456"
        type:
          type: string
          enum: [page, product, article]
          example: "product"
        languageCode:
          type: string
          enum: [en, it, he]
          example: "it"
        title:
          type: string
          example: "Bottiglia Ecologica"
        slug:
          type: string
          example: "bottiglia-ecologica"
        body:
          type: string
          description: HTML or JSON content
          example: "<p>Bottiglia riutilizzabile...</p>"
        excerpt:
          type: string
          example: "Bottiglia sostenibile in acciaio inossidabile"
        seo:
          $ref: '#/components/schemas/SEOMetadata'
        url:
          $ref: '#/components/schemas/URLData'
        publishedAt:
          type: string
          format: date-time
          example: "2025-10-01T00:00:00Z"
        translations:
          type: object
          description: Available translations
          additionalProperties:
            type: string
            format: uri
          example:
            en: "https://affilibuster.com/products/eco-bottle"
            he: "https://affilibuster.com/il/products/eco-bottle"
      required:
        - id
        - type
        - languageCode
        - title
        - slug
        - body
        - seo
        - url

    SEOMetadata:
      type: object
      properties:
        metaTitle:
          type: string
          example: "Bottiglia Ecologica | Affilibuster"
        metaDescription:
          type: string
          example: "Acquista bottiglie riutilizzabili sostenibili"
        metaKeywords:
          type: array
          items:
            type: string
          example: ["bottiglia", "ecologica", "sostenibile"]
        customSchema:
          type: object
          description: Custom JSON-LD schema
          example:
            "@type": "Product"
            "name": "Bottiglia Ecologica"

    URLData:
      type: object
      properties:
        path:
          type: string
          example: "/it/prodotti/bottiglia-ecologica"
        canonical:
          type: string
          format: uri
          example: "https://affilibuster.com/it/prodotti/bottiglia-ecologica"
        alternates:
          type: object
          description: hreflang alternate URLs
          additionalProperties:
            type: string
            format: uri
          example:
            x-default: "https://affilibuster.com/products/eco-bottle"
            it: "https://affilibuster.com/it/prodotti/bottiglia-ecologica"
            he: "https://affilibuster.com/il/products/eco-bottle"
      required:
        - path
        - canonical
        - alternates

    ContentListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ContentSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - items
        - pagination

    ContentSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [page, product, article]
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: string
        url:
          type: string
          format: uri
        publishedAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - title
        - slug
        - url

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 150
        totalPages:
          type: integer
          example: 8
      required:
        - page
        - limit
        - total
        - totalPages

    UserPreferences:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sessionId:
          type: string
          example: "sess-abc123"
        selectedCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: "EUR"
        dismissedLanguagePrompt:
          type: boolean
          example: true
        detectedLanguage:
          type: string
          enum: [en, it, he]
          example: "it"
        expiresAt:
          type: string
          format: date-time
          example: "2025-11-03T15:30:00Z"
      required:
        - id
        - sessionId
        - selectedCurrency
        - dismissedLanguagePrompt

    UpdatePreferences:
      type: object
      properties:
        selectedCurrency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: "USD"
        dismissedLanguagePrompt:
          type: boolean
          example: true
        detectedLanguage:
          type: string
          enum: [en, it, he]
          example: "it"

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "Content with slug 'invalid-slug' not found for language 'it'"
        code:
          type: string
          example: "CONTENT_NOT_FOUND"
        timestamp:
          type: string
          format: date-time
      required:
        - error
        - message
        - code
        - timestamp

  securitySchemes:
    SessionAuth:
      type: apiKey
      in: header
      name: X-Session-Id
      description: Session ID for anonymous users

    UserAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token for authenticated users (future)

security:
  - SessionAuth: []
