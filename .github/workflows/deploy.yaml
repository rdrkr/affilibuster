name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only deploy if CI passed (or manual trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            echo "Starting deployment..."

            cd ~/affilibuster

            # Pull latest code
            echo "Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Build and deploy
            echo "Building Docker images..."
            make build-prod

            echo "Starting services..."
            make start-prod PROD_ARGS="--remove-orphans"

            # Wait for services to be healthy
            echo "Waiting for services to be healthy..."
            sleep 15

            # Health checks
            echo "Running health checks..."
            HEALTH_OK=true

            # Frontend
            if curl -sf --max-time 10 http://localhost:3000 > /dev/null 2>&1; then
              echo "  Frontend: OK"
            else
              echo "  Frontend: FAILED"
              HEALTH_OK=false
            fi

            # Backend
            if curl -sf --max-time 10 http://localhost:8000/health > /dev/null 2>&1; then
              echo "  Backend: OK"
            else
              echo "  Backend: FAILED"
              HEALTH_OK=false
            fi

            # CMS
            if curl -sf --max-time 10 http://localhost:1337/api/health > /dev/null 2>&1; then
              echo "  CMS: OK"
            else
              echo "  CMS: FAILED"
              HEALTH_OK=false
            fi

            if [ "$HEALTH_OK" = false ]; then
              echo "Health checks failed! Check logs:"
              docker compose -f docker-compose.prod.yaml logs --tail=50
              exit 1
            fi

            # Clean up old images
            echo "Cleaning up old Docker images..."
            docker image prune -af --filter "until=24h"

            echo "Deployment complete!"
