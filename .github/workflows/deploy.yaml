name: Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: ['main']
  workflow_dispatch:
    inputs:
      strapi_import:
        description: '⚠️ Import Strapi CMS data (WARNING: This DELETES all existing CMS data and replaces it)'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only deploy if CI passed (or manual trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          STRAPI_IMPORT: ${{ github.event.inputs.strapi_import || 'false' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN,DEPLOY_BRANCH,STRAPI_IMPORT
          script: |
            set -e
            echo "Starting deployment..."

            cd ~/affilibuster

            # Pull latest code (use token for HTTPS auth)
            echo "Pulling latest code from branch: ${DEPLOY_BRANCH}"
            git -c "url.https://x-access-token:${GITHUB_TOKEN}@github.com/.insteadOf=https://github.com/" fetch origin "${DEPLOY_BRANCH}"
            git reset --hard "origin/${DEPLOY_BRANCH}"

            # Build and deploy
            echo "Building Docker images..."
            make build-prod

            echo "Starting services..."
            make start-prod PROD_ARGS="--remove-orphans"

            # Wait for services to be healthy
            echo "Waiting for services to be healthy..."
            sleep 30

            # Load production env vars (needed for correct port values like CMS_PORT)
            set -a
            source .env.prod
            set +a

            # Health checks (services only expose ports inside Docker network,
            # so we curl from within containers or through Caddy on port 80)
            echo "Running health checks..."
            HEALTH_OK=true

            # Frontend (via Caddy - port 80 is mapped to host)
            if curl -sf --max-time 10 http://localhost > /dev/null 2>&1; then
              echo "  Frontend: OK"
            else
              echo "  Frontend: FAILED"
              HEALTH_OK=false
            fi

            # Backend (via Caddy /api path - Caddy strips /api prefix)
            if curl -sf --max-time 10 http://localhost/api/health > /dev/null 2>&1; then
              echo "  Backend: OK"
            else
              echo "  Backend: FAILED"
              HEALTH_OK=false
            fi

            # CMS (via Caddy on cms subdomain - tests full Caddy→Strapi path)
            if curl -sf --max-time 10 -H "Host: cms.thegreenbrother.com" http://localhost/api/health > /dev/null 2>&1; then
              echo "  CMS: OK"
            else
              echo "  CMS: FAILED"
              HEALTH_OK=false
            fi

            if [ "$HEALTH_OK" = false ]; then
              echo "Health checks failed! Check logs:"
              make dcp PROD_ARGS="logs --tail=50"
              exit 1
            fi

            # Strapi data import (only when explicitly requested)
            if [ "$STRAPI_IMPORT" = "true" ]; then
              echo "⚠️ Importing Strapi CMS data..."
              make import-prod
              echo "✅ Strapi data import complete"
            fi

            # Clean up old images
            echo "Cleaning up old Docker images..."
            docker image prune -af --filter "until=24h"

            echo "Deployment complete!"
