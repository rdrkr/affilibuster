name: Deploy
run-name: Deploy to Production

on:
  workflow_run:
    workflows: ['Preflight']
    types: [completed]
    branches: ['main']
  workflow_dispatch:
    inputs:
      strapi_import:
        description: '⚠️ Import Strapi CMS data (WARNING: This DELETES all existing CMS data and replaces it)'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  deployments: write
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only deploy if CI passed (or manual trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Create GitHub deployment
        uses: chrnorm/deployment-action@v2
        id: deployment
        with:
          token: ${{ github.token }}
          environment: production
          initial-status: in_progress
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Debug Deployment Context
        run: |
          echo "DEBUG: Deployment Context"
          echo "Event Name: ${{ github.event_name }}"
          echo "Ref Name: ${{ github.ref_name }}"
          echo "Workflow Run Head Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Workflow Run ID: ${{ github.event.workflow_run.id }}"
          echo "Workflow Run Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Calculated DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Use head_branch for workflow_run (CI trigger), ref_name for manual dispatch
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          STRAPI_IMPORT: ${{ github.event.inputs.strapi_import || 'false' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GITHUB_TOKEN,DEPLOY_BRANCH,STRAPI_IMPORT
          command_timeout: 30m
          script: |
            set -e
            echo "Starting deployment..."

            cd ~/affilibuster

            # Pull latest code (use token for HTTPS auth)
            echo "Pulling latest code from branch: ${DEPLOY_BRANCH}"
            git -c "url.https://x-access-token:${GITHUB_TOKEN}@github.com/.insteadOf=https://github.com/" fetch origin "${DEPLOY_BRANCH}"
            git reset --hard "origin/${DEPLOY_BRANCH}"

            # Load production env vars (needed for correct port values like CMS_PORT)
            # Generate .env.prod from secrets (production mode)
            echo "Generating .env.prod..."
            bash scripts/generate-env.sh production \
              -n "${{ secrets.CLOUDINARY_NAME }}" \
              -k "${{ secrets.CLOUDINARY_KEY }}" \
              -s "${{ secrets.CLOUDINARY_SECRET }}" \
              -u "${{ secrets.UPTIME_KUMA_USER }}" \
              -p "${{ secrets.UPTIME_KUMA_PASS }}" \
              -b "${{ secrets.UPTIME_KUMA_TELEGRAM_BOT_TOKEN }}" \
              -c "${{ secrets.UPTIME_KUMA_TELEGRAM_CHAT_ID }}" \
              -g "${{ vars.GA_ID }}" \
              -t "${{ vars.GTM_ID }}" \
              -a "${{ secrets.BREVO_API_KEY }}" \
              -l "${{ secrets.BREVO_LIST_ID }}" \
              -d "${{ secrets.BREVO_DOI_TEMPLATE_ID }}" \
              -r "${{ secrets.BREVO_DOI_REDIRECT_URL }}"

            set -a
            source .env.prod
            set +a

            # Build and deploy
            echo "Building Docker images..."
            make build-prod

            echo "Starting services..."
            make start-prod PROD_ARGS="--remove-orphans --force-recreate"

            # Wait for services to be healthy
            echo "Waiting for services to be healthy..."
            sleep 30

            # Health checks (services only expose ports inside Docker network,
            # so we curl from within containers or through Caddy on port 80)
            echo "Running health checks..."
            HEALTH_OK=true

            # Frontend (via Caddy - port 80 is mapped to host)
            if curl -sf --max-time 100 http://localhost > /dev/null 2>&1; then
              echo "  Frontend: OK"
            else
              echo "  Frontend: FAILED"
              HEALTH_OK=false
            fi

            # Backend (via Caddy /api path - Caddy strips /api prefix)
            if curl -sf --max-time 100 http://localhost/api/health > /dev/null 2>&1; then
              echo "  Backend: OK"
            else
              echo "  Backend: FAILED"
              HEALTH_OK=false
            fi

            # CMS (via Caddy on cms subdomain - tests full Caddy→Strapi path)
            if curl -sf --max-time 100 -H "Host: cms.thegreenbrother.com" http://localhost/api/health > /dev/null 2>&1; then
              echo "  CMS: OK"
            else
              echo "  CMS: FAILED"
              HEALTH_OK=false
            fi

            # Uptime Monitor (via Caddy on uptime subdomain)
            # 1. HTTP check (routing)
            if curl -sf --max-time 100 -H "Host: uptime.thegreenbrother.com" http://localhost > /dev/null 2>&1; then
              echo "  Uptime: OK"
            else
              echo "  Uptime: FAILED"
              HEALTH_OK=false
            fi

            if [ "$HEALTH_OK" = false ]; then
              echo "Health checks failed! Check logs:"
              make dcp PROD_ARGS="logs --tail=50"
              exit 1
            fi

            # Auto-provision Uptime Kuma monitors
            echo "Provisioning Uptime Kuma monitors..."
            if docker compose -f docker-compose.prod.yaml exec -T backend /app/.venv/bin/python scripts/provision_uptime.py; then
               echo "✅ Uptime Kuma provisioning successful"
            else
               echo "⚠️ Uptime Kuma provisioning failed (non-critical)"
               # We don't fail the deployment for this, just warn
            fi

            # Strapi data import (only when explicitly requested)
            if [ "$STRAPI_IMPORT" = "true" ]; then
              echo "⚠️ Importing Strapi CMS data..."
              make import-prod
              echo "✅ Strapi data import complete"
            fi

            # Clean up old images
            echo "Cleaning up old Docker images..."
            docker image prune -af --filter "until=24h"

            echo "Deployment complete!"

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: success
          environment-url: https://thegreenbrother.com

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: ${{ github.token }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: failure

      # ========================================
      # Changelog & Telegram Notifications
      # ========================================
      - name: Checkout for changelog
        if: success()
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Generate changelog
        if: success()
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Get the SHA of the previous successful production deployment
          PREV_SHA=$(gh api \
            "repos/${{ github.repository }}/deployments?environment=production&per_page=10" \
            --jq '.[1].sha // empty')

          CURRENT_SHA=$(git rev-parse HEAD)

          if [ -z "$PREV_SHA" ]; then
            echo "changelog=No previous deployment found" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get commit subjects between previous and current deployment
          COMMITS=$(git log --format='%s' "${PREV_SHA}..${CURRENT_SHA}" 2>/dev/null || true)

          if [ -z "$COMMITS" ]; then
            echo "changelog=No changes detected" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ADDED=""
          FIXED=""
          REMOVED=""
          OTHER=""

          while IFS= read -r line; do
            # Parse "action :: message" format (case-insensitive action match)
            if echo "$line" | grep -qE '^[^:]+::'; then
              ACTION=$(echo "$line" | sed 's/ *::.*$//' | tr '[:upper:]' '[:lower:]' | xargs)
              MSG=$(echo "$line" | sed 's/^[^:]*:: *//')
            else
              OTHER="${OTHER}• ${line}\n"
              continue
            fi

            case "$ACTION" in
              add|added|feat|feature|new)
                ADDED="${ADDED}• ${MSG}\n"
                ;;
              fix|fixed|bugfix|hotfix)
                FIXED="${FIXED}• ${MSG}\n"
                ;;
              remove|removed|delete|deleted)
                REMOVED="${REMOVED}• ${MSG}\n"
                ;;
              *)
                OTHER="${OTHER}• ${MSG}\n"
                ;;
            esac
          done <<< "$COMMITS"

          # Build changelog text
          CHANGELOG=""
          if [ -n "$ADDED" ]; then
            CHANGELOG="${CHANGELOG}\n✨ <b>Added</b>\n${ADDED}"
          fi
          if [ -n "$FIXED" ]; then
            CHANGELOG="${CHANGELOG}\n🐛 <b>Fixed</b>\n${FIXED}"
          fi
          if [ -n "$REMOVED" ]; then
            CHANGELOG="${CHANGELOG}\n🗑 <b>Removed</b>\n${REMOVED}"
          fi
          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}\n📝 <b>Other</b>\n${OTHER}"
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No categorized changes"
          fi

          # Use multiline output for GitHub Actions
          {
            echo 'changelog<<EOF'
            printf '%b' "$CHANGELOG"
            echo ''
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram (success)
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.UPTIME_KUMA_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.UPTIME_KUMA_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
        run: |
          # Trim whitespace/newlines from secrets to prevent curl URL malformat
          TELEGRAM_TOKEN="$(echo -n "$TELEGRAM_TOKEN" | tr -d '[:space:]')"
          TELEGRAM_CHAT_ID="$(echo -n "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')"
          printf -v MESSAGE '%s\n%s\n%s\n%s\n%s\n%s\n\n📋 %s\n%s' \
            '🚀 <b>Deploy Successful</b>' \
            '📦 <b>Repo:</b> ${{ github.repository }}' \
            "🔀 <b>Branch:</b> ${DEPLOY_BRANCH}" \
            '👤 <b>By:</b> ${{ github.actor }}' \
            "🌐 <a href=\"https://thegreenbrother.com\">thegreenbrother.com</a>" \
            "🔗 <a href=\"${RUN_URL}\">View Run</a>" \
            '<b>Changelog</b>' \
            "${CHANGELOG}"
          curl -sf -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"

      - name: Notify Telegram (failure)
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.UPTIME_KUMA_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.UPTIME_KUMA_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          # Trim whitespace/newlines from secrets to prevent curl URL malformat
          TELEGRAM_TOKEN="$(echo -n "$TELEGRAM_TOKEN" | tr -d '[:space:]')"
          TELEGRAM_CHAT_ID="$(echo -n "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')"
          printf -v MESSAGE '%s\n%s\n%s\n%s\n%s' \
            '❌ <b>Deploy Failed</b>' \
            '📦 <b>Repo:</b> ${{ github.repository }}' \
            "🔀 <b>Branch:</b> ${DEPLOY_BRANCH}" \
            '👤 <b>By:</b> ${{ github.actor }}' \
            "🔗 <a href=\"${RUN_URL}\">View Run</a>"
          curl -sf -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"
