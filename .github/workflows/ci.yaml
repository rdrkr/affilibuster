name: CI

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'
  UV_VERSION: '0.5.15'

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ========================================
      # 0. Free Disk Space (Fix for "no space left on device")
      # ========================================
      - name: Free Disk Space
        run: |
          echo "🧹 Freeing up disk space..."
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af
          echo "Disk space after cleanup:"
          df -h

      # ========================================
      # 1. Checkout & Setup Tools
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Note: npm cache disabled because package-lock.json files are not committed
          # They will be generated during npm install in the build process

      - name: Install uv (Python package manager)
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================
      # 2. Setup Development Environment
      # ========================================
      - name: Setup development tools and dependencies
        run: make setup

      # ========================================
      # 3. Validate Required Secrets and Variables
      # ========================================
      - name: Validate required secrets and environment variables
        run: |
          echo "🔍 Validating required secrets and variables..."
          MISSING_VARS=()

          # Critical configuration that must be defined
          REQUIRED_VARS=(
            "POSTGRES_USER"
            "POSTGRES_PASSWORD"
            "ADMIN_JWT_SECRET"
            "API_TOKEN_SALT"
            "API_TOKEN_ENCRYPTION_KEY"
            "TRANSFER_TOKEN_SALT"
            "APP_KEYS"
            "JWT_SECRET"
            "REVALIDATE_SECRET"
          )

          for var in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!var}" ]; then
              MISSING_VARS+=("$var")
            fi
          done

          if [ ${#MISSING_VARS[@]} -gt 0 ]; then
            echo "❌ ERROR: Missing required configuration:"
            printf '  - %s\n' "${MISSING_VARS[@]}"
            echo ""
            echo "Please define these in GitHub repository settings:"
            echo "Settings → Secrets and variables → Actions"
            echo "- Secrets: passwords, tokens, JWT secrets"
            echo "- Variables: usernames, non-sensitive config"
            exit 1
          fi

          echo "✅ All required configuration is defined"
        env:
          POSTGRES_USER: ${{ vars.POSTGRES_USER || secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          API_TOKEN_SALT: ${{ secrets.API_TOKEN_SALT }}
          API_TOKEN_ENCRYPTION_KEY: ${{ secrets.API_TOKEN_ENCRYPTION_KEY }}
          TRANSFER_TOKEN_SALT: ${{ secrets.TRANSFER_TOKEN_SALT }}
          APP_KEYS: ${{ secrets.APP_KEYS }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}

      # ========================================
      # 4. Create Environment Configuration
      # ========================================
      - name: Create .env file from secrets and variables
        run: |
          cat > .env <<EOF
          # Copyright (c) 2025 Affilibuster by Ronen Druker.
          # Auto-generated for CI/CD

          # ======================================
          # SHARED INFRASTRUCTURE
          # ======================================
          POSTGRES_PROTOCOL=${{ vars.POSTGRES_PROTOCOL }}
          POSTGRES_HOST=${{ vars.POSTGRES_HOST }}
          INTERNAL_POSTGRES_HOST=${{ vars.INTERNAL_POSTGRES_HOST }}
          POSTGRES_PORT=${{ vars.POSTGRES_PORT }}
          POSTGRES_USER=${{ vars.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ vars.POSTGRES_DB }}
          POSTGRES_SSL=${{ vars.POSTGRES_SSL }}
          POSTGRES_SSL_REJECT_UNAUTHORIZED=${{ vars.POSTGRES_SSL_REJECT_UNAUTHORIZED }}

          REDIS_PROTOCOL=${{ vars.REDIS_PROTOCOL }}
          REDIS_HOST=${{ vars.REDIS_HOST }}
          INTERNAL_REDIS_HOST=${{ vars.INTERNAL_REDIS_HOST }}
          REDIS_PORT=${{ vars.REDIS_PORT }}
          REDIS_TTL_PREFERENCES=${{ vars.REDIS_TTL_PREFERENCES }}

          # ======================================
          # CMS (Strapi 5)
          # ======================================
          CMS_PROTOCOL=${{ vars.CMS_PROTOCOL }}
          CMS_PORT=${{ vars.CMS_PORT }}
          CMS_HOST=${{ vars.CMS_HOST }}
          INTERNAL_CMS_HOST=${{ vars.INTERNAL_CMS_HOST }}
          CMS_URL_PROD=${{ vars.CMS_URL_PROD }}
          CMS_URL_DEV=${{ vars.CMS_URL_DEV }}

          # SSL Certificate Paths (for Docker HTTPS)
          SSL_CERT_PATH=${{ vars.SSL_CERT_PATH }}
          SSL_KEY_PATH=${{ vars.SSL_KEY_PATH }}

          # Cloudinary Configuration (for CMS image uploads)
          CLOUDINARY_NAME=${{ secrets.CLOUDINARY_NAME }}
          CLOUDINARY_KEY=${{ secrets.CLOUDINARY_KEY }}
          CLOUDINARY_SECRET=${{ secrets.CLOUDINARY_SECRET }}

          # Security Keys
          ADMIN_JWT_SECRET=${{ secrets.ADMIN_JWT_SECRET }}
          API_TOKEN_SALT=${{ secrets.API_TOKEN_SALT }}
          API_TOKEN_ENCRYPTION_KEY=${{ secrets.API_TOKEN_ENCRYPTION_KEY }}
          TRANSFER_TOKEN_SALT=${{ secrets.TRANSFER_TOKEN_SALT }}
          APP_KEYS=${{ secrets.APP_KEYS }}

          # ======================================
          # BACKEND (FastAPI)
          # ======================================
          APP_ENV=${{ vars.APP_ENV }}
          DEBUG=${{ vars.DEBUG }}
          LOG_LEVEL=${{ vars.LOG_LEVEL }}

          BACKEND_PROTOCOL=${{ vars.BACKEND_PROTOCOL }}
          BACKEND_PORT=${{ vars.BACKEND_PORT }}
          BACKEND_HOST=${{ vars.BACKEND_HOST }}
          INTERNAL_BACKEND_HOST=${{ vars.INTERNAL_BACKEND_HOST }}
          BACKEND_URL_PROD=${{ vars.BACKEND_URL_PROD }}
          BACKEND_URL_DEV=${{ vars.BACKEND_URL_DEV }}

          JWT_SECRET=${{ secrets.JWT_SECRET }}

          # ======================================
          # THE_GREEN_BROTHER (Next.js)
          # ======================================
          NODE_ENV=${{ vars.NODE_ENV }}
          NODE_EXTRA_CA_CERTS=${{ vars.NODE_EXTRA_CA_CERTS }}
          NEXT_TELEMETRY_DISABLED=${{ vars.NEXT_TELEMETRY_DISABLED }}

          THE_GREEN_BROTHER_PROTOCOL=${{ vars.THE_GREEN_BROTHER_PROTOCOL }}
          THE_GREEN_BROTHER_PORT=${{ vars.THE_GREEN_BROTHER_PORT }}
          THE_GREEN_BROTHER_HOST=${{ vars.THE_GREEN_BROTHER_HOST }}
          INTERNAL_THE_GREEN_BROTHER_HOST=${{ vars.INTERNAL_THE_GREEN_BROTHER_HOST }}
          NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_SERVER_SIDE_API_URL=${{ vars.NEXT_SERVER_SIDE_API_URL }}
          NEXT_PUBLIC_CMS_URL=${{ vars.NEXT_PUBLIC_CMS_URL }}
          PLAYWRIGHT_REPORT_PORT=${{ vars.PLAYWRIGHT_REPORT_PORT }}
          REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}
          NEXT_PUBLIC_GA_ID=
          NEXT_PUBLIC_GTM_ID=
          EOF

          echo "✅ .env file created"

      # ========================================
      # 5. Run Pre-commit Hooks
      # ========================================
      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      # ========================================
      # 6. Build & Test Project
      # ========================================
      - name: Run make all-fast
        run: |
          echo "🔨 Building project..."
          make all-fast

      # ========================================
      # 7. Show Docker Logs (on failure)
      # ========================================
      - name: Show Docker services status
        if: failure()
        run: |
          echo "🔍 Docker Compose Services Status:"
          docker compose ps || true

      - name: Show Docker logs
        if: failure()
        run: |
          echo "📋 Docker Compose Logs (last 100 lines):"
          docker compose logs --tail=100 || true

      # ========================================
      # 8. Upload Coverage Reports (Optional)
      # ========================================
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov/
          if-no-files-found: ignore

      - name: Upload the-green-brother coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-green-brother-coverage
          path: the-green-brother/coverage/
          if-no-files-found: ignore

      - name: Upload merged coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage
          path: coverage-merged/
          if-no-files-found: ignore
