name: Preflight

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  NODE_VERSION: '22'
  UV_VERSION: '0.5.15'

jobs:
  ci:
    name: CI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ========================================
      # 0. Free Disk Space (Fix for "no space left on device")
      # ========================================
      - name: Free Disk Space
        run: |
          echo "🧹 Freeing up disk space..."
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          docker system prune -af
          echo "Disk space after cleanup:"
          df -h

      # ========================================
      # 1. Checkout & Setup Tools
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install uv (Python package manager)
        uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================
      # 2. Setup Development Environment
      # ========================================
      - name: Setup development tools and dependencies
        run: make setup

      # ========================================
      # 3. Validate Required Secrets and Variables
      # ========================================
      - name: Validate required secrets and environment variables
        run: |
          echo "🔍 Validating required secrets and variables..."
          MISSING_VARS=()

          # Critical configuration that must be defined in GitHub Secrets
          REQUIRED_VARS=(
            "CLOUDINARY_NAME"
            "CLOUDINARY_KEY"
            "CLOUDINARY_SECRET"
            "UPTIME_KUMA_USER"
            "UPTIME_KUMA_PASS"
            "UPTIME_KUMA_TELEGRAM_BOT_TOKEN"
            "UPTIME_KUMA_TELEGRAM_CHAT_ID"
          )

          for var in "${REQUIRED_VARS[@]}"; do
            if [ -z "${!var}" ]; then
              MISSING_VARS+=("$var")
            fi
          done

          if [ ${#MISSING_VARS[@]} -gt 0 ]; then
            echo "❌ ERROR: Missing required configuration:"
            printf '  - %s\n' "${MISSING_VARS[@]}"
            echo ""
            echo "Please define these in GitHub repository settings:"
            echo "Settings → Secrets and variables → Actions → Secrets"
            exit 1
          fi

          echo "✅ All required external secrets are defined"
        env:
          CLOUDINARY_NAME: ${{ secrets.CLOUDINARY_NAME }}
          CLOUDINARY_KEY: ${{ secrets.CLOUDINARY_KEY }}
          CLOUDINARY_SECRET: ${{ secrets.CLOUDINARY_SECRET }}
          UPTIME_KUMA_USER: ${{ secrets.UPTIME_KUMA_USER }}
          UPTIME_KUMA_PASS: ${{ secrets.UPTIME_KUMA_PASS }}
          UPTIME_KUMA_TELEGRAM_BOT_TOKEN: ${{ secrets.UPTIME_KUMA_TELEGRAM_BOT_TOKEN }}
          UPTIME_KUMA_TELEGRAM_CHAT_ID: ${{ secrets.UPTIME_KUMA_TELEGRAM_CHAT_ID }}

      # ========================================
      # 4. Create Environment Configuration
      # ========================================
      - name: Create .env file from secrets and variables
        run: |
          echo "Generating environment configuration..."

          # Generate .env.prod using the script with available secrets
          # Note: Most vars are internal defaults in the script, so we only pass external secrets
          bash scripts/generate-env.sh development \
            -n "${{ secrets.CLOUDINARY_NAME }}" \
            -k "${{ secrets.CLOUDINARY_KEY }}" \
            -s "${{ secrets.CLOUDINARY_SECRET }}" \
            -u "${{ secrets.UPTIME_KUMA_USER }}" \
            -p "${{ secrets.UPTIME_KUMA_PASS }}" \
            -b "${{ secrets.UPTIME_KUMA_TELEGRAM_BOT_TOKEN }}" \
            -c "${{ secrets.UPTIME_KUMA_TELEGRAM_CHAT_ID }}" \
            -g "" \
            -t ""

          echo "✅ .env file created"

      # ========================================
      # 5. Run Pre-commit Hooks
      # ========================================
      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      # ========================================
      # 6. Build & Test Project
      # ========================================
      - name: Run make all-fast
        run: |
          echo "🔨 Building project..."
          make all-fast

      # ========================================
      # 7. Show Docker Logs (on failure)
      # ========================================
      - name: Show Docker services status
        if: failure()
        run: |
          echo "🔍 Docker Compose Services Status:"
          docker compose ps || true

      - name: Show Docker logs
        if: failure()
        run: |
          echo "📋 Docker Compose Logs (last 100 lines):"
          docker compose logs --tail=100 || true

      # ========================================
      # 8. Upload Coverage Reports (Optional)
      # ========================================
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov/
          if-no-files-found: ignore

      - name: Upload the-green-brother coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-green-brother-coverage
          path: the-green-brother/coverage/
          if-no-files-found: ignore

      - name: Upload merged coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage
          path: coverage-merged/
          if-no-files-found: ignore

      # ========================================
      # 9. Telegram Notifications
      # ========================================
      - name: Notify Telegram (success)
        if: false # to enable: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.UPTIME_KUMA_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.UPTIME_KUMA_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Trim whitespace/newlines from secrets to prevent curl URL malformat
          TELEGRAM_TOKEN="$(echo -n "$TELEGRAM_TOKEN" | tr -d '[:space:]')"
          TELEGRAM_CHAT_ID="$(echo -n "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')"
          printf -v MESSAGE '%s\n%s\n%s\n%s\n%s\n%s' \
            '✅ <b>CI Passed</b>' \
            '📦 <b>Repo:</b> ${{ github.repository }}' \
            '🔀 <b>Branch:</b> ${{ github.ref_name }}' \
            '📝 <b>Commit:</b> <code>${{ github.sha }}</code>' \
            '👤 <b>By:</b> ${{ github.actor }}' \
            "🔗 <a href=\"${RUN_URL}\">View Run</a>"
          curl -sf -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"

      - name: Notify Telegram (failure)
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.UPTIME_KUMA_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.UPTIME_KUMA_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Trim whitespace/newlines from secrets to prevent curl URL malformat
          TELEGRAM_TOKEN="$(echo -n "$TELEGRAM_TOKEN" | tr -d '[:space:]')"
          TELEGRAM_CHAT_ID="$(echo -n "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')"
          printf -v MESSAGE '%s\n%s\n%s\n%s\n%s\n%s' \
            '❌ <b>CI Failed</b>' \
            '📦 <b>Repo:</b> ${{ github.repository }}' \
            '🔀 <b>Branch:</b> ${{ github.ref_name }}' \
            '📝 <b>Commit:</b> <code>${{ github.sha }}</code>' \
            '👤 <b>By:</b> ${{ github.actor }}' \
            "🔗 <a href=\"${RUN_URL}\">View Run</a>"
          curl -sf -X POST \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"
