fail_fast: false
exclude: |
  (?x)^(
    \.git/|
    \.next/|
    \.pytest_cache/|
    \.venv/|
    __pycache__/|
    alembic/versions/|
    backend/htmlcov/|
    backend/src/affilibuster_backend/domain/entities/generated/|
    build/|
    cms/build/|
    cms/types/|
    contracts/affilibuster.openapi.yaml|
    contracts/strapi.openapi.yaml|
    coverage/|
    dist/|
    frontend/coverage/|
    frontend/src/lib/generated/|
    htmlcov/|
    log\.txt|
    node_modules/|
    package-lock\.json|
    venv/
  )
repos:
  # Security scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  # Copyright header enforcement - Python, Bash, YAML, TOML
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: Check copyright headers (Python, Bash, YAML, TOML)
        files: \.(py|sh|bash|yaml|yml|toml)$
        args:
          - --license-filepath
          - .copyright-header.txt
          - --comment-style
          - '|#|'
          - --use-current-year
          - --detect-license-in-X-top-lines=3

  # Copyright header enforcement - TypeScript, JavaScript
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: Check copyright headers (TypeScript, JavaScript)
        files: \.(ts|tsx|js|jsx)$
        args:
          - --license-filepath
          - .copyright-header.txt
          - --comment-style
          - '|//|'
          - --use-current-year
          - --detect-license-in-X-top-lines=3

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of file
      - id: check-yaml
        name: Check YAML
      - id: check-json
        name: Check JSON
      - id: check-toml
        name: Check TOML
      - id: check-xml
        name: Check XML
      - id: detect-private-key
        name: Detect private keys
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: [ -f, lf ]
      - id: check-case-conflict
        name: Check case conflicts
      - id: check-docstring-first
        name: Check docstring is first in Python files
      - id: check-ast
        name: Check Python AST validity

  # Code formatters and linters (centralized via make)
  - repo: local
    hooks:
      - id: format
        name: Format code (make format)
        entry: bash -c 'make format'
        language: system
        pass_filenames: false
        always_run: true
      - id: lint
        name: Lint code (make lint)
        entry: bash -c 'make lint'
        language: system
        pass_filenames: false
        always_run: true
